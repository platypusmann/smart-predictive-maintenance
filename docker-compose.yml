# Run everything in containers:   docker compose up --build
# Just the database for local dev: docker compose up -d mongo
# Add the simulator + edge bridge: docker compose --profile load up

services:
  broker:
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883'
    command: >
      sh -c "printf 'listener 1883\nallow_anonymous true\n' > /mosquitto/config/mosquitto.conf
      && exec mosquitto -c /mosquitto/config/mosquitto.conf"

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    ports:
      - '3001:3001'
    environment:
      MONGO_URI: mongodb://mongo:27017/pdm
      MQTT_URL: mqtt://broker:1883
      API_KEY: ${API_KEY:-local-dev-key}
    depends_on: [broker, mongo]

  inference:
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    ports:
      - '3002:3002'
    environment:
      MONGO_URI: mongodb://mongo:27017/pdm
      MQTT_URL: mqtt://broker:1883
      CPU_BURN_MS: ${CPU_BURN_MS:-0}
    depends_on: [broker, mongo]

  alerting:
    build:
      context: .
      dockerfile: services/alerting/Dockerfile
    ports:
      - '3003:3003'
    environment:
      MONGO_URI: mongodb://mongo:27017/pdm
      MQTT_URL: mqtt://broker:1883
    depends_on: [broker, mongo]

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    ports:
      - '3000:3000'
    environment:
      INGESTION_URL: http://ingestion:3001
      INFERENCE_URL: http://inference:3002
      ALERTING_URL: http://alerting:3003
    depends_on: [ingestion, inference, alerting]

  node-red:
    image: nodered/node-red:4.0
    ports:
      - '1880:1880'
    environment:
      PDM_API_KEY: ${API_KEY:-local-dev-key}
    volumes:
      - ./node-red/flows.json:/data/flows.json:ro
      - node-red-data:/data
    depends_on: [broker, ingestion]

  simulator:
    profiles: ['load']
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    command: ['node', 'services/simulator/src/index.js', '--machines', '50', '--time-scale', '120']
    environment:
      MQTT_URL: mqtt://broker:1883
    depends_on: [broker]

  edge-bridge:
    profiles: ['load']
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    command: ['node', 'services/edge-bridge/src/index.js']
    environment:
      MQTT_URL: mqtt://broker:1883
      INGESTION_URL: http://ingestion:3001
      API_KEY: ${API_KEY:-local-dev-key}
    depends_on: [broker, ingestion]

volumes:
  mongo-data:
  node-red-data:
