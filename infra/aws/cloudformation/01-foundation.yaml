AWSTemplateFormatVersion: '2010-09-09'
Description: PdM foundation - VPC, ECR repositories, SQS queues and secrets

Resources:

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: pdm-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # load balancer needs subnets in two AZs
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP to the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks, only reachable from the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3010
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  IngestionRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: pdm/ingestion

  InferenceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: pdm/inference

  AlertingRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: pdm/alerting

  FeaturesQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: pdm-features

  HighRiskQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: pdm-high-risk

  # value is set by deploy.sh from $MONGO_URI
  MongoUriSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pdm/mongo-uri

  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pdm/edge-api-key
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: pdm-vpc-id
  PublicSubnets:
    Value: !Join [',', [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export:
      Name: pdm-public-subnets
  LoadBalancerSecurityGroupId:
    Value: !Ref LoadBalancerSecurityGroup
    Export:
      Name: pdm-alb-sg
  ServiceSecurityGroupId:
    Value: !Ref ServiceSecurityGroup
    Export:
      Name: pdm-service-sg
  FeaturesQueueUrl:
    Value: !Ref FeaturesQueue
    Export:
      Name: pdm-features-queue-url
  HighRiskQueueUrl:
    Value: !Ref HighRiskQueue
    Export:
      Name: pdm-high-risk-queue-url
  MongoUriSecretArn:
    Value: !Ref MongoUriSecret
    Export:
      Name: pdm-mongo-secret
  ApiKeySecretArn:
    Value: !Ref ApiKeySecret
    Export:
      Name: pdm-api-key-secret
