AWSTemplateFormatVersion: '2010-09-09'
Description: PdM services - ECS cluster, the three services, load balancer and auto scaling

Resources:

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: pdm-cluster

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/pdm
      RetentionInDays: 7

  # used by ECS to pull images and read the secrets
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !ImportValue pdm-mongo-secret
                  - !ImportValue pdm-api-key-secret

  # role for the containers themselves, shared by all three services
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pdm-queues
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:pdm-*'

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: pdm-alb
      Scheme: internet-facing
      SecurityGroups:
        - !ImportValue pdm-alb-sg
      Subnets: !Split [',', !ImportValue pdm-public-subnets]

  IngestionTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: pdm-ingestion-tg
      Port: 3001
      Protocol: HTTP
      TargetType: ip
      VpcId: !ImportValue pdm-vpc-id
      HealthCheckPath: /health

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref IngestionTargetGroup

  IngestionTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: pdm-ingestion
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: ingestion
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pdm/ingestion:latest'
          PortMappings:
            - ContainerPort: 3001
          Environment:
            - Name: USE_SQS
              Value: 'true'
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: FEATURES_QUEUE_URL
              Value: !ImportValue pdm-features-queue-url
          Secrets:
            - Name: MONGO_URI
              ValueFrom: !ImportValue pdm-mongo-secret
            - Name: API_KEY
              ValueFrom: !ImportValue pdm-api-key-secret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ingestion

  InferenceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: pdm-inference
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: inference
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pdm/inference:latest'
          Environment:
            - Name: USE_SQS
              Value: 'true'
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: FEATURES_QUEUE_URL
              Value: !ImportValue pdm-features-queue-url
            - Name: HIGH_RISK_QUEUE_URL
              Value: !ImportValue pdm-high-risk-queue-url
            - Name: CPU_BURN_MS
              Value: '0'
          Secrets:
            - Name: MONGO_URI
              ValueFrom: !ImportValue pdm-mongo-secret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: inference

  AlertingTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: pdm-alerting
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: alerting
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/pdm/alerting:latest'
          Environment:
            - Name: USE_SQS
              Value: 'true'
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: HIGH_RISK_QUEUE_URL
              Value: !ImportValue pdm-high-risk-queue-url
          Secrets:
            - Name: MONGO_URI
              ValueFrom: !ImportValue pdm-mongo-secret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: alerting

  IngestionService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: pdm-ingestion
      Cluster: !Ref Cluster
      TaskDefinition: !Ref IngestionTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !ImportValue pdm-service-sg
          Subnets: !Split [',', !ImportValue pdm-public-subnets]
      LoadBalancers:
        - ContainerName: ingestion
          ContainerPort: 3001
          TargetGroupArn: !Ref IngestionTargetGroup

  InferenceService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: pdm-inference
      Cluster: !Ref Cluster
      TaskDefinition: !Ref InferenceTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !ImportValue pdm-service-sg
          Subnets: !Split [',', !ImportValue pdm-public-subnets]

  AlertingService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: pdm-alerting
      Cluster: !Ref Cluster
      TaskDefinition: !Ref AlertingTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !ImportValue pdm-service-sg
          Subnets: !Split [',', !ImportValue pdm-public-subnets]

  # Auto scaling for inference (1-10 tasks) based on how many messages are
  # waiting in the features queue
  InferenceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${InferenceService.Name}'
      MinCapacity: 1
      MaxCapacity: 10

  InferenceScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: pdm-inference-queue-depth
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref InferenceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 30
        ScaleOutCooldown: 60
        ScaleInCooldown: 300
        CustomizedMetricSpecification:
          Namespace: AWS/SQS
          MetricName: ApproximateNumberOfMessagesVisible
          Statistic: Average
          Dimensions:
            - Name: QueueName
              Value: pdm-features

Outputs:
  IngestionEndpoint:
    Value: !Sub 'http://${LoadBalancer.DNSName}'
